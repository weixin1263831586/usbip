name: Release usbipd

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Pinned to ubuntu-22.04: the bundled binary is auto-deployed to Ubuntu
    # 22.04 source hosts (glibc 2.35). ubuntu-latest (24.04, glibc 2.39)
    # produces binaries that fail on those hosts with
    # "GLIBC_2.39 not found". Bump only when the oldest supported source
    # host OS moves up.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Build usbipd
        run: cargo build --release --bin usbipd

      - name: Prepare release files
        run: |
          cp target/release/usbipd usbipd-linux-x86_64
          sha256sum usbipd-linux-x86_64 > usbipd-linux-x86_64.sha256

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              usbipd-linux-x86_64 \
              usbipd-linux-x86_64.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              usbipd-linux-x86_64 \
              usbipd-linux-x86_64.sha256 \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
